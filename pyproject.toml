[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mltools"
version         = "1.0.0"
description     = "Reusable ML Pipeline Library — Preprocessing + Modeling"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "MIT" }

dependencies = [
    # Core data
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pyarrow>=14.0",

    # ML
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "imbalanced-learn>=0.11",

    # Feature engineering
    "category-encoders>=2.6",
    "feature-engine>=1.6",

    # Tuning & tracking
    "optuna>=3.5",
    "mlflow>=2.10",

    # Interpretation
    "shap>=0.44",

    # Serving
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "joblib>=1.3",

    # Config & utils
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "httpx>=0.25",
]

neural = [
    "torch>=2.1",
    "pytorch-tabnet>=4.1",
]

[project.scripts]
mltools-train = "mltools.cli:train_command"
mltools-serve = "mltools.cli:serve_command"

[tool.setuptools.packages.find]
where = ["src"]

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short --cov=src/mltools --cov-report=term-missing"
markers      = [
    "slow: Test yang lambat, skip by default",
    "integration: Test integrasi end-to-end",
    "unit: Unit test per komponen",
]

# ── black ─────────────────────────────────────────────────────
[tool.black]
line-length    = 88
target-version = ["py310", "py311"]

# ── ruff ──────────────────────────────────────────────────────
[tool.ruff]
line-length    = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

# ── mypy ──────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.10"
ignore_missing_imports = true
warn_return_any        = true